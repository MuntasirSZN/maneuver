[package]
name = "maneuver"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Generate structured man pages"
documentation = "https://docs.rs/maneuver"
readme = "README.md"
repository = "https://github.com/MuntasirSZN/maneuver"
license = "MIT OR Apache-2.0"
keywords = ["man", "manpage", "roff", "documentation"]
categories = ["command-line-utilities", "documentation", "text-processing"]

[dependencies]
roff = "1.1.1"

[dev-dependencies]
insta = "1"
